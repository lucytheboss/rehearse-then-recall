# Embedding/scoring preprocessing configuration
# gisting/rehearsal must be performed query-agnostic (without knowledge of
# the question) — the question only appears at the final QA stage.
#
# nvidia/llama-nemotron-embed-1b-v2 (the originally-planned model was discontinued)
# 26 languages including Korean, max 32,768 tokens; input_type/truncate parameters
# are the same as the previous model; this model's spec has no dimensions
# parameter (currently unused/null, so no issue).
model: nvidia/llama-nemotron-embed-1b-v2

truncate: NONE   # NONE/START/END — how the server handles input over 512 tokens
batch_size: 16   # number of chunks (passages) per embeddings call
timeout: 30.0    # seconds
max_retries: 2   # immediate retry count on failure (no exponential backoff)

# Matryoshka embedding dimension-reduction option (if the model supports
# it). If null, omitted from the request and the model's default
# dimensionality is used.
# TODO: decide the actual value after weighing the speed/accuracy tradeoff (Hub.md §5 TODO)
dimensions: null

# TODO: once lookup is implemented, tune lookup_window_size in the 1-3 range and compare performance to decide.
api_key_env: NVIDIA_NIM_API_KEY

# Fallback strategy on API failure
#   pass_through — passes the whole chunk through without a score (pipeline doesn't die; default)
#   raise        — propagates the exception as-is (when you want failures to be explicit)
on_error: pass_through
