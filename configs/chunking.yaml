# Chunking configuration
# min/max determine the lower/upper bound of a chunk's size
# Semantically-distant points become the chunking cutoffs

# Threshold in words (whitespace-delimited tokens).
#
# Recalculated 2026-07-30, bounded by RoBERTa's 512-token limit.
#
# The extractive stage (maintenance rehearsal, A) is a RoBERTa sentence
# scorer, following Sie et al. (NLLP 2024, arXiv:2408.09777), whose grid
# found RoBERTa + a single dependent-ratio pass to be the best extractive
# configuration. RoBERTa uses learned position embeddings, so 512 is a hard
# architectural ceiling, not a config knob: anything past it is silently
# dropped, and a dropped sentence can never be selected.
#
# Budget per chunk, BERTSUM-style (one <s>/</s> pair per sentence so each
# sentence has a token to classify):
#     content tokens + 2 * n_sentences + 2  <=  512
#
# Measured with roberta-base over this project's four corpora (novel / news /
# caselaw / wiki), taking the *maximum* over sliding windows — i.e. assuming
# every chunk fills the cap:
#
#     max_words | novel  news  caselaw  wiki
#     ----------+---------------------------
#           200 |   365   319      446   370     <- all fit
#           250 |   444   389      522!  438
#           300 |   521!  464      605!  532!
#           350 |   607!  555!     690!  616!    <- the previous setting
#
# caselaw binds: legal citations tokenize densely (1.57 tokens/word vs 1.26
# for wiki). The previous 350 overflowed on every genre, so max_words=200 is
# a correction, not a tuning choice.
#
# t5-small (elaborative rehearsal, B) was checked at the same time and is
# looser: 468 tokens worst case at 200 words, against its configured 512.
#
# min_words scales with it, keeping roughly the old 0.43 min/max proportion so
# the seam search still has a usable window to pick a low-similarity boundary
# in. Re-measure both if the backbone changes.
min_words: 90
max_words: 200

# Chunks at the sentence level (not paragraph) by default. Paragraph
# boundaries are used only as candidate points. Since a paragraph can run
# long enough in characters to hit API call-size limits.
preserve_paragraph_integrity: false

# Cut criteria (see paginate_semantic's docstring; in priority order)
#   1. Never cut inside a sentence (nltk) — the smallest unit, an always-preserved hard floor.
#   2. A line of dialogue with an unclosed quote mark (even spanning
#      multiple sentences) is treated as one group — a chunk boundary never
#      falls in the middle of it.
#   3. If a group from #2 exceeds max_words (dialogue too long), fall back
#      to sentence-level splitting to prioritize the chunk size cap — #1
#      still always holds even then.
#   4. <p> boundaries are candidate points; only a scene_break paragraph is
#      a hard boundary (see explanation above).
#   5. Among candidate seams (paragraph/dialogue-group boundaries) within
#      the min_words~max_words window, pick the one with the lowest
#      embedding cosine similarity as the chunk boundary.
