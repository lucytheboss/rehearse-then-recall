# Chunking configuration
# min/max determine the lower/upper bound of a chunk's size
# Semantically-distant points become the chunking cutoffs

# Threshold in words (whitespace-delimited tokens).
#
# Recalculated 2026-07-16 (based on pko-t5 context length): per the official
# paust/pko-t5 repo (github.com/paust-team/pko-t5), KLUE evaluation training
# used input_ids max_length=1300 tokens, stated to cover 98.4% of train /
# 100% of dev context at that length. The rehearsal model's input is
# "previous key sentences (accumulated) + new chunk", so a single chunk
# should not consume the full 1300 tokens — some budget must be left for
# prior context — so the chunk itself gets a bit over half the budget
# (~700 tokens).
#
# NOTE: the word->token conversion ratio here is an estimate — this sandbox
# has HuggingFace model downloads blocked by network policy, so it wasn't
# possible to measure directly with the pko-t5 tokenizer. Given BBPE
# characteristics, Korean runs roughly 1.5-2 tokens per word, so working
# backward (700 / 1.5-2 ~= 350-470 words) gives max_words=350 as a
# conservative choice. Re-verify with the snippet below on a
# network-enabled environment (e.g. Colab):
#
#   from transformers import T5TokenizerFast
#   tok = T5TokenizerFast.from_pretrained("paust/pko-t5-base")
#   text = "actual chunk sample text..."
#   print(len(tok(text).input_ids) / len(text.split()))  # token/word ratio
#
# Use this ratio to reconvert the 700-token budget above into a word count
# and re-tune min/max_words.
min_words: 150
max_words: 350

# Chunks at the sentence level (not paragraph) by default. Paragraph
# boundaries are used only as candidate points. Since a paragraph can run
# long enough in characters to hit API call-size limits.
preserve_paragraph_integrity: false

# Cut criteria (see paginate_semantic's docstring; in priority order)
#   1. Never cut inside a sentence (nltk) — the smallest unit, an always-preserved hard floor.
#   2. A line of dialogue with an unclosed quote mark (even spanning
#      multiple sentences) is treated as one group — a chunk boundary never
#      falls in the middle of it.
#   3. If a group from #2 exceeds max_words (dialogue too long), fall back
#      to sentence-level splitting to prioritize the chunk size cap — #1
#      still always holds even then.
#   4. <p> boundaries are candidate points; only a scene_break paragraph is
#      a hard boundary (see explanation above).
#   5. Among candidate seams (paragraph/dialogue-group boundaries) within
#      the min_words~max_words window, pick the one with the lowest
#      embedding cosine similarity as the chunk boundary.
